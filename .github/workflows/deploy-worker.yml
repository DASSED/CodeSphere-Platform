name: Deploy Worker

# Publishes the base "codesphere" Worker from develop. `wrangler preview` never applies routes:
# this deploy is what creates the preview.codesphereplatform.xyz custom domain and, through
# previews_enabled, the *.preview wildcard every pull request preview is served on (#86).
# Run it once, then again whenever the routes in apps/web/wrangler.jsonc change.
# The base Worker has no database or OAuth secrets: only the previews serve the app.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'preview.codesphereplatform.xyz' }}

jobs:
  deploy:
    name: Deploy the base Worker
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run env:generate

      - name: Build the Worker
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SERVER_URL: https://${{ env.PREVIEW_DOMAIN }}
        run: bunx opennextjs-cloudflare build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --message "${GITHUB_SHA::7}"
