name: Preview

# One preview per pull request to develop (map #86): a Neon branch for the data, a Cloudflare
# Workers Preview for the code, both removed when the pull request closes.
#
# Off until the repository variable PREVIEW_ENABLED is "true" (secrets and the Worker entry
# must exist first). Pull requests from forks never get a preview or any secret (#89).
#
# Repository variables: PREVIEW_ENABLED, NEON_PROJECT_ID, NEON_PARENT_BRANCH, PREVIEW_DOMAIN
# Repository secrets (environment "preview"): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   NEON_API_KEY, PREVIEW_BETTER_AUTH_SECRET, PREVIEW_OAUTH_PROXY_SECRET,
#   PREVIEW_{GITHUB,GITLAB,GOOGLE}_CLIENT_{ID,SECRET} (the staging OAuth apps, #100)
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# Deploy and cleanup of one pull request never overlap.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  PREVIEW_NAME: pr-${{ github.event.number }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'preview.codesphereplatform.xyz' }}

jobs:
  deploy:
    name: Deploy preview
    if: >
      github.event.action != 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run env:generate

      # Safety net if the cleanup job never runs; a push does not extend it.
      - name: Expiry of the Neon branch
        id: expiry
        run: echo "at=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH || 'staging' }}
          branch_name: preview/${{ env.PREVIEW_NAME }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Migrate the preview database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: bunx drizzle-kit migrate

      - name: Build the Worker
        working-directory: apps/web
        env:
          # Inlined at build time, hence one build per pull request.
          NEXT_PUBLIC_SERVER_URL: https://${{ env.PREVIEW_NAME }}.${{ env.PREVIEW_DOMAIN }}
        run: bunx opennextjs-cloudflare build

      - name: Deploy the Preview
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: https://${{ env.PREVIEW_NAME }}.${{ env.PREVIEW_DOMAIN }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          OAUTH_PROXY_SECRET: ${{ secrets.PREVIEW_OAUTH_PROXY_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
          GITLAB_CLIENT_ID: ${{ secrets.PREVIEW_GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITLAB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.PREVIEW_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PREVIEW_GOOGLE_CLIENT_SECRET }}
        run: |
          # Secrets go through a file, never the command line; removed right after.
          umask 077
          node ../../scripts/preview-secrets.mjs preview-secrets.json
          # One origin for the web and the API: no CORS, first-party cookies. The staging
          # origin is the only callback URL the identity providers know (OAuth proxy, #98).
          bunx wrangler preview \
            --name "$PREVIEW_NAME" \
            --tag "$PREVIEW_NAME" \
            --message "$COMMIT" \
            --var "BETTER_AUTH_URL:$ORIGIN" \
            --var "CORS_ORIGIN:$ORIGIN" \
            --var "OAUTH_PROXY_PRODUCTION_URL:https://staging.codesphereplatform.xyz" \
            --secrets-file preview-secrets.json
          rm -f preview-secrets.json
          echo "url=$ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nCommit \`${sha}\`. Removed when this pull request closes.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: Remove preview
    if: >
      github.event.action == 'closed' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts

      # A preview that was never created, or is already gone, must not fail the job.
      - name: Delete the Worker preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation || true

      - name: Delete the Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/${{ env.PREVIEW_NAME }}
