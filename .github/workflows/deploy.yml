name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: deploy-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# Off until the repository variable DEPLOY_ENABLED is "true" (the Cloud Server, the DEPLOY_HOST and
# DEPLOY_SSH_KEY secrets and the environments must exist first), like PREVIEW_ENABLED for previews.
jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: |
          touch apps/web/.env apps/server/.env
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/0xdaydy/codesphere-${{ matrix.app }}:${{ github.sha }}
          secret-files: |
            web_env=apps/web/.env
            server_env=apps/server/.env
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://staging.codesphereplatform.xyz

  deploy-staging:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/codesphere/deploy
            ./deploy.sh staging ${{ github.sha }}

  deploy-production:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/codesphere/deploy
            ./deploy.sh production ${{ github.sha }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --verify-tag --generate-notes
