<title>Prototypes Accueil CodeSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: five homes for the same content (shell, CADEV banner with the real contest calendar, feed zone),
   judged as visitor / Member / Admin on desktop or a 390 px phone. Palette Latérite, warm paper neutrals,
   Outfit for everything human, JetBrains Mono for data (dates, counts, tags). */
:root {
  --bg: #f6f1eb; --surface: #fffdfa; --sunk: #efe7de; --fg: #241a15; --muted: #7a685e; --faint: #a7978c;
  --line: #e7ddd3; --line-strong: #d8cabd;
  --accent: #a8432a; --accent-deep: #7a2c19; --accent-fg: #ffffff; --accent-soft: #f4e2d8; --gold: #d68a1f;
  --ok: #2f7d4f; --ok-soft: #e1f0e6;
  --shadow-sm: 0 1px 2px rgba(60, 30, 15, .06), 0 1px 1px rgba(60, 30, 15, .04);
  --shadow: 0 12px 32px -12px rgba(60, 30, 15, .22);
  --font: "Outfit", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15100d; --surface: #1d1612; --sunk: #241b16; --fg: #f3eae4; --muted: #a8988e; --faint: #7d6d63;
    --line: #33281f; --line-strong: #443529;
    --accent: #e27a5c; --accent-deep: #b9533a; --accent-fg: #1a0f0b; --accent-soft: #35201a; --gold: #e6a74c;
    --ok: #82d3a0; --ok-soft: #17301f;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 14px 34px -12px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15100d; --surface: #1d1612; --sunk: #241b16; --fg: #f3eae4; --muted: #a8988e; --faint: #7d6d63;
  --line: #33281f; --line-strong: #443529;
  --accent: #e27a5c; --accent-deep: #b9533a; --accent-fg: #1a0f0b; --accent-soft: #35201a; --gold: #e6a74c;
  --ok: #82d3a0; --ok-soft: #17301f;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 14px 34px -12px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p, ol, ul { margin: 0; }
svg.i { width: 1.05em; height: 1.05em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#stage { min-height: 100svh; background: var(--bg); }
#stage.m { width: 390px; max-width: 100%; margin: 1.25rem auto 7rem; min-height: 780px; border: 1px solid var(--line-strong); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: .5rem .9rem; font-weight: 500; font-size: .9rem; white-space: nowrap; transition: border-color .15s, background .15s, transform .15s; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn.pri { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); box-shadow: 0 1px 0 rgba(255, 255, 255, .2) inset, var(--shadow-sm); }
.btn.pri:hover:not([disabled]) { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover:not([disabled]) { color: var(--fg); border-color: transparent; background: var(--sunk); }
.btn.onbrand { background: rgba(255, 255, 255, .14); color: #fff; border-color: rgba(255, 255, 255, .35); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.logo { display: inline-flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.08rem; letter-spacing: -.01em; white-space: nowrap; color: var(--fg); }
.logo svg { width: 1.6rem; height: 1.6rem; }
.kbd { font: 500 .7rem var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: .05rem .35rem; background: var(--surface); }
.chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .1rem .55rem; font-size: .72rem; font-weight: 600; letter-spacing: .01em; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ag { border: 1px dashed var(--gold); color: var(--gold); }
.eyebrow { font: 600 .68rem var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

/* ---------- header ---------- */
.hd { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.hd .in { display: flex; align-items: center; gap: 1rem; height: 4rem; padding: 0 1.5rem; max-width: 76rem; margin: 0 auto; }
.hd .sp { flex: 1; }
.search { display: flex; align-items: center; gap: .55rem; flex: 1; max-width: 25rem; height: 2.4rem; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 .75rem; color: var(--faint); font-size: .88rem; }
.search span.t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav2 { display: flex; gap: .25rem; }
.nav2 a { color: var(--muted); text-decoration: none; padding: .4rem .7rem; border-radius: 8px; font-weight: 500; font-size: .92rem; }
.nav2 a:hover { color: var(--fg); background: var(--sunk); }
.nav2 a.on { color: var(--fg); }
.av { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1.5px var(--accent); background: linear-gradient(135deg, var(--accent), var(--gold)); color: #fff; font-weight: 700; font-size: .78rem; letter-spacing: .02em; }
.menu { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 15rem; padding: .35rem; display: grid; animation: in .14s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } }
.pop button { display: flex; align-items: center; gap: .6rem; text-align: left; border: 0; background: none; padding: .55rem .65rem; border-radius: 9px; font-size: .9rem; }
.pop button:hover { background: var(--sunk); }
.pop .who { display: flex; gap: .65rem; align-items: center; padding: .6rem .65rem .75rem; border-bottom: 1px solid var(--line); margin-bottom: .3rem; }
.pop .who b { display: block; font-size: .92rem; }
.pop .who small { color: var(--muted); font-size: .78rem; }
.pop .sep { height: 1px; background: var(--line); margin: .3rem .2rem; }
.pop .tag { margin-left: auto; font: 600 .62rem var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: .1rem .35rem; letter-spacing: .06em; }

/* ---------- layout ---------- */
.wrap { max-width: 47rem; margin: 0 auto; padding: 2rem 1.5rem 3rem; display: grid; gap: 1.5rem; }
.wrap.wide { max-width: 76rem; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 2.25rem; align-items: start; }
.rail { position: sticky; top: 5.5rem; display: grid; gap: 1rem; }

/* ---------- CADEV banner: its own colour world, same in both themes ---------- */
.cadev { position: relative; overflow: hidden; border-radius: 22px; color: #fff8f2; padding: 1.75rem 1.9rem 1.5rem;
  background:
    radial-gradient(120% 140% at 100% 0%, rgba(230, 167, 76, .42) 0%, transparent 46%),
    radial-gradient(90% 120% at 0% 100%, rgba(60, 14, 4, .55) 0%, transparent 55%),
    linear-gradient(135deg, #b14a2d 0%, #8a3320 55%, #5e2112 100%);
  box-shadow: 0 24px 48px -24px rgba(122, 44, 25, .65); }
.cadev::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 14px); -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000); mask-image: linear-gradient(90deg, transparent 30%, #000); }
.cadev > * { position: relative; }
.cadev .top { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
.cadev .eyebrow { color: rgba(255, 240, 228, .78); display: inline-flex; align-items: center; gap: .5rem; }
.cadev .live { width: .45rem; height: .45rem; border-radius: 50%; background: #ffd08a; box-shadow: 0 0 0 4px rgba(255, 208, 138, .25); }
.cadev h2 { font-size: clamp(1.45rem, 3vw, 1.95rem); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; margin-top: .55rem; max-width: 26rem; text-wrap: balance; }
.cadev p.s { margin-top: .5rem; color: rgba(255, 240, 228, .82); max-width: 30rem; font-size: .95rem; }
.count { display: flex; align-items: baseline; gap: .9rem; font-family: var(--mono); }
.count .u { display: grid; justify-items: start; }
.count b { font-size: 3.1rem; font-weight: 600; line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.count small { font-family: var(--font); font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: rgba(255, 240, 228, .7); margin-top: .35rem; }
.cadev .tlwrap { margin-top: 1.5rem; padding-top: 1.1rem; border-top: 1px solid rgba(255, 255, 255, .16); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.tl { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; flex: 1 1 26rem; position: relative; }
.tl li { position: relative; padding-top: 1.05rem; font-size: .76rem; color: rgba(255, 240, 228, .7); }
.tl li::before { content: ""; position: absolute; left: 0; right: -.5rem; top: .32rem; height: 2px; background: rgba(255, 255, 255, .2); }
.tl li:last-child::before { right: 0; }
.tl li::after { content: ""; position: absolute; left: 0; top: 0; width: .7rem; height: .7rem; border-radius: 50%; background: #8a3320; border: 2px solid rgba(255, 255, 255, .45); }
.tl li b { display: block; color: #fff8f2; font-weight: 600; font-size: .8rem; }
.tl li span { font-family: var(--mono); font-size: .7rem; }
.tl li.next::after { background: #ffd08a; border-color: #ffd08a; box-shadow: 0 0 0 4px rgba(255, 208, 138, .25); }
.tl li.done::after { background: #fff8f2; border-color: #fff8f2; }
.tl li.done::before { background: rgba(255, 255, 255, .6); }
.cadev .cta { margin-left: auto; }

.ribbon { position: relative; overflow: hidden; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; border-radius: 14px; padding: .75rem 1rem; color: #fff8f2;
  background: radial-gradient(80% 160% at 100% 0%, rgba(230, 167, 76, .4), transparent 50%), linear-gradient(120deg, #a8432a, #6d2716); }
.ribbon .mark { display: grid; place-items: center; width: 2.3rem; height: 2.3rem; border-radius: 10px; background: rgba(255, 255, 255, .14); }
.ribbon .txt b { display: block; font-weight: 600; font-size: .95rem; }
.ribbon .txt small { color: rgba(255, 240, 228, .75); font-size: .78rem; }
.ribbon .num { font-family: var(--mono); font-size: 1.4rem; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ribbon .num small { font-family: var(--font); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 240, 228, .7); margin-left: .35rem; }
.ribbon .btn { margin-left: auto; padding: .35rem .7rem; font-size: .82rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.2rem; display: grid; gap: .7rem; box-shadow: var(--shadow-sm); }
.card h3 { font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
.card p { color: var(--muted); font-size: .9rem; }
.ringbox { display: flex; align-items: center; gap: 1rem; }
.ring { width: 5.2rem; height: 5.2rem; flex: none; }
.ring .bgc { stroke: var(--sunk); }
.ring .fgc { stroke: var(--accent); }
.ring text { font-family: var(--mono); font-weight: 600; fill: var(--fg); }
.steps { list-style: none; padding: 0; display: grid; gap: .55rem; }
.steps li { display: flex; gap: .6rem; align-items: center; font-size: .88rem; color: var(--muted); }
.steps li i { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; display: grid; place-items: center; font-style: normal; font-size: .7rem; }
.steps li.done { color: var(--fg); }
.steps li.done i { background: var(--ok); border-color: var(--ok); color: #fff; }

/* ---------- tabs ---------- */
.seg { display: inline-flex; gap: .2rem; padding: .25rem; background: var(--sunk); border-radius: 12px; }
.seg button { border: 0; background: none; padding: .38rem .85rem; border-radius: 9px; font-size: .88rem; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: .35rem; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); font-weight: 600; }
.seg button .lk { width: .85em; height: .85em; }
.feedhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.feedhead .note { font-size: .74rem; color: var(--faint); font-family: var(--mono); }

/* ---------- feed ---------- */
.feed { display: grid; gap: .8rem; }
.q { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem 1.2rem; transition: border-color .15s, box-shadow .15s, transform .15s; }
.q:hover { border-color: var(--line-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
.q.agent { border-style: dashed; border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }
.q .votes { display: grid; justify-items: center; align-content: start; gap: .15rem; padding-top: .1rem; }
.q .votes b { font: 600 1.25rem var(--mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.q .votes small { color: var(--faint); font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; }
.q .votes .ans { margin-top: .35rem; font: 600 .78rem var(--mono); border-radius: 7px; padding: .1rem .4rem; border: 1px solid var(--line-strong); color: var(--muted); }
.q .votes .ans.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.q .by { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); }
.q .by .mini { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; font-size: .6rem; font-weight: 700; color: #fff; }
.q .by b { color: var(--fg); font-weight: 600; }
.q h3 { font-size: 1.05rem; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; margin-top: .45rem; text-wrap: pretty; }
.q .row { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-top: .7rem; }
.q .tg { font: 500 .74rem var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: .12rem .45rem; }
.q .meta { margin-left: auto; display: flex; gap: .55rem; color: var(--faint); font: 500 .72rem var(--mono); }
.exnote { font-size: .76rem; color: var(--faint); text-align: center; padding-top: .25rem; }

.empty { position: relative; border: 1px solid var(--line); border-radius: 22px; padding: 2.75rem 1.5rem 2.5rem; text-align: center; background:
  radial-gradient(60% 80% at 50% 0%, var(--accent-soft), transparent 70%), var(--surface); display: grid; gap: .6rem; justify-items: center; }
.empty svg.ill { width: 7.5rem; height: auto; margin-bottom: .5rem; }
.empty h3 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.015em; }
.empty p { color: var(--muted); max-width: 26rem; }
.empty .acts { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; justify-content: center; }

.skel { display: grid; gap: .8rem; }
.skel div { height: 6.2rem; border-radius: 18px; background: linear-gradient(90deg, var(--sunk) 0%, var(--surface) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: sh 1.3s ease-in-out infinite; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }

/* ---------- hero (variant 4) ---------- */
.hero { position: relative; padding: 4rem 1.5rem 2.5rem; max-width: 47rem; margin: 0 auto; display: grid; gap: 1.25rem; }
.hero h1 { font-size: clamp(2.1rem, 5.4vw, 3.4rem); font-weight: 700; line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); position: relative; white-space: nowrap; }
.hero h1 em::after { content: ""; position: absolute; left: 0; right: 0; bottom: .02em; height: .14em; border-radius: 99px; background: var(--gold); opacity: .55; z-index: -1; }
.hero p.lead { color: var(--muted); max-width: 33rem; font-size: 1.1rem; font-weight: 300; }
.sso { display: flex; gap: .6rem; flex-wrap: wrap; }
.sso .btn { padding: .65rem 1.05rem; font-size: .95rem; }
.pillars { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--muted); font-size: .85rem; padding-top: .5rem; }
.pillars span { display: inline-flex; align-items: center; gap: .45rem; }
.pillars svg { color: var(--accent); }
.hello { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
.hello h1 { font-size: 1.85rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
.hello p { color: var(--muted); margin-top: .25rem; }

/* ---------- app rail (variant 5) ---------- */
.shell5 { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100svh; }
.navrail { position: sticky; top: 0; height: 100svh; border-right: 1px solid var(--line); background: var(--surface); padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1.6rem; }
.navrail ul { list-style: none; padding: 0; display: grid; gap: .15rem; }
.navrail .lbl { font: 600 .64rem var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--faint); padding: 0 .7rem .35rem; }
.navrail a { display: flex; align-items: center; gap: .65rem; padding: .55rem .7rem; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: .92rem; }
.navrail a:hover { background: var(--sunk); color: var(--fg); }
.navrail a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navrail .mini-cadev { margin-top: auto; border-radius: 14px; padding: .85rem; color: #fff8f2; background: linear-gradient(135deg, #a8432a, #6d2716); display: grid; gap: .2rem; }
.navrail .mini-cadev b { font: 600 1.5rem var(--mono); letter-spacing: -.03em; }
.navrail .mini-cadev small { font-size: .72rem; color: rgba(255, 240, 228, .78); }
.top5 { position: sticky; top: 0; z-index: 20; display: flex; gap: .8rem; align-items: center; height: 4rem; padding: 0 1.75rem; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); }

/* ---------- dialog / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(28, 14, 8, .5); backdrop-filter: blur(3px); z-index: 80; display: grid; place-items: center; padding: 1rem; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 1.75rem; width: min(27rem, 100%); box-shadow: var(--shadow); display: grid; gap: 1.1rem; animation: in .18s ease-out; }
.dlg .lg { display: flex; justify-content: center; }
.dlg .lg svg { width: 2.6rem; height: 2.6rem; }
.dlg h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; text-align: center; }
.dlg p.sub { color: var(--muted); text-align: center; font-size: .92rem; margin-top: -.6rem; }
.dlg .prov { display: grid; gap: .55rem; }
.dlg .prov .btn { justify-content: center; padding: .7rem; font-size: .95rem; }
.dlg .prov .btn svg { width: 1.15rem; height: 1.15rem; }
.dlg label { display: flex; gap: .65rem; align-items: flex-start; font-size: .84rem; color: var(--muted); background: var(--sunk); border-radius: 12px; padding: .75rem .85rem; }
.dlg label input { margin-top: .2rem; accent-color: var(--accent); }
.dlg .fine { text-align: center; font-size: .76rem; color: var(--faint); }
.toast { position: fixed; left: 50%; bottom: 7.5rem; transform: translateX(-50%); z-index: 90; background: var(--fg); color: var(--bg); border-radius: 12px; padding: .65rem 1rem; max-width: calc(100% - 2rem); box-shadow: var(--shadow); font-size: .9rem; animation: in .15s ease-out; }

.footer { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; max-width: 76rem; margin: 0 auto; padding: 1.5rem; border-top: 1px solid var(--line); color: var(--faint); font: 500 .74rem var(--mono); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- phone frame or narrow viewport ---------- */
.m .search .t, .m .search .kbd, .m .nav2 { display: none; }
.m .search { flex: 0 0 auto; width: 2.4rem; padding: 0; justify-content: center; }
.m .hd .in { padding: 0 1rem; gap: .5rem; height: 3.6rem; }
.m .btn.ask .lbl { display: none; }
.m .cols { grid-template-columns: 1fr; gap: 1.25rem; }
.m .rail { position: static; }

    var nav = '<aside class="navrail">' + logo() + '<div><p class="lbl">Explorer</p><ul><li><a class="on" href="#" data-a="noop">' + I.home + 'Accueil</a></li><li><a href="#" data-a="noop">' + I.tag + 'Tags</a></li><li><a href="#" data-a="noop">' + I.trophy + "Hackathon</a></li></ul></div>" +
      (isIn() ? '<div><p class="lbl">Compte</p><ul><li><a href="#" data-a="toast" data-t="Réglages">' + I.gear + "Réglages</a></li>" + (S.role === "admin" ? '<li><a href="#" data-a="toast" data-t="Administration (/admin)">' + I.shield + "Administration</a></li>" : "") + "</ul></div>" : "") +
      '<div class="mini-cadev"><small>CADEV 2026 · clôture</small><b>' + l.d + " j " + pad(l.h) + " h</b><small>25 oct. · 17 h GMT</small></div></aside>";
    return '<div class="shell5">' + nav + '<div style="min-width:0"><div class="top5">' + search(true) + '<span class="sp" style="flex:1"></span>' + ask() + user() + '</div><main class="wrap">' + banner() + feedHead() + feed() + "</main>" + footer() + "</div></div>";
  }
  function narrow() { return S.mobile || window.innerWidth < 640; }
  function vR() { return narrow() ? v4() : isIn() ? v3() : v1(); }
  var VIEWS = [v1, v2, v3, v4, v5, vR];

  function login() {
    var dis = S.consent ? "" : " disabled";
    return '<div class="scrim" data-a="close"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="lg">' + LOGO + '</div><h2 id="dlg-t">Rejoindre CodeSphere</h2><p class="sub">Aucun mot de passe : connectez-vous avec un compte que vous avez déjà.</p>' +
      '<label><input type="checkbox" id="consent"' + (S.consent ? " checked" : "") + ' data-a="consent"><span>J\'accepte les conditions d\'utilisation et la politique de confidentialité.</span></label>' +
      '<div class="prov"><button class="btn" data-a="signin"' + dis + ">" + I.gh + "Continuer avec GitHub</button><button class=\"btn\" data-a=\"signin\"" + dis + ">" + I.gl + "Continuer avec GitLab</button><button class=\"btn\" data-a=\"signin\"" + dis + ">" + I.go + "Continuer avec Google</button></div>" +
      '<p class="fine">Lecture libre sans compte. Votre email n\'est jamais public.</p><button class="btn ghost" data-a="close" style="justify-self:center">Annuler</button></div></div>';
  }

  function render() {
    var stage = document.getElementById("stage");
    stage.className = (S.mobile || window.innerWidth < 640) ? "m" : "";
    stage.innerHTML = VIEWS[S.v]();
    document.getElementById("overlay").innerHTML = (S.login ? login() : "") + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + "</div>" : "");
    document.getElementById("count").textContent = (S.v + 1) + " / " + VARS.length;
    document.getElementById("name").innerHTML = esc(VARS[S.v][0]) + "<small>" + esc(VARS[S.v][1]) + "</small>";
    document.getElementById("dots").innerHTML = VARS.map(function (_, i) { return '<i class="' + (i === S.v ? "on" : "") + '"></i>'; }).join("");
    document.getElementById("roles").innerHTML = ROLES.map(function (r) { return '<button type="button" data-role="' + r[0] + '" class="' + (S.role === r[0] ? "on" : "") + '">' + r[1] + "</button>"; }).join("");
    document.getElementById("feeds").innerHTML = FEEDS.map(function (r) { return '<button type="button" data-feed="' + r[0] + '" class="' + (S.feed === r[0] ? "on" : "") + '">' + r[1] + "</button>"; }).join("");
    document.getElementById("widths").innerHTML = '<button type="button" data-w="0" class="' + (!S.mobile ? "on" : "") + '">Bureau</button><button type="button" data-w="1" class="' + (S.mobile ? "on" : "") + '">Mobile 390 px</button>';
  }
  function flash(t) { S.toast = t; render(); setTimeout(function () { if (S.toast === t) { S.toast = ""; render(); } }, 2200); }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var role = t.closest("[data-role]"); if (role) { S.role = role.dataset.role; S.menu = false; render(); return; }
    var fd = t.closest("[data-feed]"); if (fd) { S.feed = fd.dataset.feed; render(); return; }
    var w = t.closest("[data-w]"); if (w) { S.mobile = w.dataset.w === "1"; render(); return; }
    var el = t.closest("[data-a]");
    if (el && el.dataset.a === "close" && el.classList.contains("scrim") && t !== el) return;
    if (el) {
      var a = el.dataset.a;
      if (el.tagName === "A") e.preventDefault();
      if (a === "login") { S.login = true; S.consent = false; S.menu = false; }
      else if (a === "close") { S.login = false; }
      else if (a === "consent") { S.consent = el.checked; }
      else if (a === "signin") { S.role = "member"; S.login = false; flash("Connecté (démo) : retour sur l'accueil."); return; }
      else if (a === "menu") { S.menu = !S.menu; }
      else if (a === "logout") { S.role = "visitor"; S.menu = false; }
      else if (a === "ask") { if (!isIn()) { S.login = true; S.consent = false; } else { flash("Formulaire de question : ticket « Question B »"); return; } }
      else if (a === "toast") { S.menu = false; flash(el.dataset.t + " : écran d'un autre ticket"); return; }
      render(); return;
    }
    if (S.menu && !t.closest(".menu")) { S.menu = false; render(); }
  });
  function go(d) { S.v = (S.v + d + VARS.length) % VARS.length; S.menu = false; render(); }
  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    var tg = e.target.tagName;
    if (tg === "INPUT" || tg === "TEXTAREA") return;
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "Escape" && (S.login || S.menu)) { S.login = false; S.menu = false; render(); }
  });
  window.addEventListener("resize", render);

  (function () {
    var box = document.getElementById("picker"), grip = document.getElementById("grip"), ox = 0, oy = 0, drag = false;
    grip.addEventListener("pointerdown", function (e) {
      drag = true; var r = box.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top;
      box.style.left = r.left + "px"; box.style.top = r.top + "px"; box.style.right = "auto"; box.style.bottom = "auto";
      grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener("pointermove", function (e) {
      if (!drag) return;
      box.style.left = Math.min(Math.max(0, e.clientX - ox), window.innerWidth - box.offsetWidth) + "px";
      box.style.top = Math.min(Math.max(0, e.clientY - oy), window.innerHeight - box.offsetHeight) + "px";
    });
    grip.addEventListener("pointerup", function () { drag = false; });
  })();

  render();
})();
</script>
